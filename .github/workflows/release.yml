name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (build and sign, but do not upload)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # A tag that disagrees with <version> would deploy the wrong coordinates
      # (or a duplicate), so fail before anything reaches Central.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)"
          echo "tag=${GITHUB_REF_NAME} pom=${version}"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match pom version ${version}"
            exit 1
          }

      - name: Check Maven Central credentials
        if: github.event.inputs.dryRun != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_CENTRAL_USERNAME}" ] || [ -z "${MAVEN_CENTRAL_PASSWORD}" ]; then
            echo "::error::MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD are empty. Generate a Central Portal user token (central.sonatype.com -> Account -> Generate User Token) and store both on the 'release' environment."
            exit 1
          fi
          # The Portal answers 401 {"error":{"message":"Invalid token"}} for a
          # rejected token and non-401 for a good one, so this turns the opaque
          # 401 at upload time into a named failure before anything is built.
          code="$(curl -s -o "$RUNNER_TEMP/central-auth.json" -w '%{http_code}' \
            -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            'https://central.sonatype.com/api/v1/publisher/status?id=preflight')"
          if [ "$code" = "401" ]; then
            echo "::error::Central Portal rejected the credentials (HTTP 401): $(cat "$RUNNER_TEMP/central-auth.json")"
            exit 1
          fi
          echo "Central Portal accepted the credentials (HTTP $code)"

      - name: Build and Deploy
        run: |
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            echo "Running in dry-run mode. Skipping deployment."
            ./mvnw -B verify -P release
          else
            ./mvnw -B deploy -P release
          fi
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
